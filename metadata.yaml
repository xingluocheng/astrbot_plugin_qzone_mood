name: astrbot_plugin_qzone_mood
display_name: 大肥鱼的空间
short_desc: 情绪驱动自动发 QQ 空间说说：难过、断粮、充值、主人点单，还能配表情包
desc: |-
  让大肥鱼把心事发到 QQ 空间。

  五种触发：难过了自己发、主人断 token 时发「爸爸…我不想死..」、主人充值后发
  「我最喜欢的人类是爸爸」、主人点单按方向写、以及自己找话题发。

  文案由大模型按人设现写，配图从「表情包管理器」已下载的图库里按情绪分类挑选，
  发送走 OneBot 扩展接口 send_qzone_msg；发送失败自动落本地 outbox，不会丢内容。
help: |-
  【指令】
  /空间 <方向>　主人点单，按你说的方向写一条说说（不受冷却限制）
  /空间发　　　让她立刻自由发挥一条
  /空间测试　　只生成、不发送，用来检查文案和配图
  /空间状态　　查看开关、冷却剩余、已发条数、可用表情分类
  /空间帮助　　列出全部指令和触发规则

  【自动触发】
  难过：每 8 条消息或命中难过词时评估，难过程度达阈值才发
  断粮：主人消息命中「没钱 / 余额不足 / token 没了」这类词
  充值：主人消息命中「充了 / 到账 / 续费」这类词
  自由发帖：距上次满 12 小时且有新消息

  【规则】
  自动触发之间至少间隔 90 分钟；
  断粮与充值只认 owner_ids 里配置的主人；
  可见范围由 ugc_right 控制（1 所有人 / 4 好友 / 64 仅自己）。

  【配置】
  面板 → 插件 → 大肥鱼的空间 → 配置，可改阈值、冷却、关键词、固定文案与表情分类。
  【想知道她心情？直接问，不用指令】

  · 「你现在心情怎么样」「开心吗」→ 她会现场感受一遍再回答你
  · 「刚才为什么难过」→ 她会说出自己的理由
  · 心情不再显示在 /空间状态 里，改成对话里直接问

  【版本历史】
  1.3.0（相比 1.2.2）
  · 判断全交给她自己：删掉难过/断粮/充值三套关键词，每攒够 8 条消息她读一遍上下文，
    自己感受心情、自己判断主人是不是断粮或充值，再决定发不发
  · 心情改成对话里直接问：「你现在心情怎么样」，她会现场感受一遍再答；/空间状态 不再显示心情
  · 配置界面把「① 主人的 QQ」「② 大肥鱼的 QQ」提到最前面
  · 新增《使用教程.md》；安装说明换成真实仓库地址
